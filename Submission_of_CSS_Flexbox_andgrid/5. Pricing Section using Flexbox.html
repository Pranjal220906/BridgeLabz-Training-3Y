<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            margin: 40px;
        }

        .pricing {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 30px;
        }

        .card {
            background-color: white;
            width: 280px;
            padding: 35px;
            text-align: center;
            border-radius: 10px;

            opacity: 0;
            animation: fadeIn 1s ease forwards;

            transition: 0.3s;
        }

        .card:nth-child(2) {
            animation-delay: 0.3s;
        }

        .card:nth-child(3) {
            animation-delay: 0.6s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .featured {
            background-color: #dff0ff;
            transform: scale(1.08);
        }

        .featured:hover {
            transform: scale(1.08) translateY(-10px);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card p {
            margin: 10px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #333;
            color: white;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 750px) {
            .pricing {
                flex-direction: column;
            }

            .card {
                width: 80%;
            }

            .featured {
                transform: scale(1);
            }

            .featured:hover {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>

    <h1>Pricing Plans</h1>

    <section class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <div class="price">₹499</div>

            <p>5 Projects</p>
            <p>10 GB Storage</p>
            <p>Email Support</p>

            <button>Choose Plan</button>
        </div>

        <div class="card featured">
            <h2>Pro</h2>
            <div class="price">₹999</div>

            <p>20 Projects</p>
            <p>50 GB Storage</p>
            <p>Priority Support</p>

            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <div class="price">₹1,499</div>

            <p>Unlimited Projects</p>
            <p>100 GB Storage</p>
            <p>24/7 Support</p>

            <button>Choose Plan</button>
        </div>

    </section>

</body>
</html>
