<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Homepage</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #222;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: space-around;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 40px;
        }

        .box {
            width: 250px;
            height: 180px;
            background-color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;

            transition: 0.3s;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        footer {
            width: 100%;
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 750px) {
            main {
                flex-direction: column;
            }

            .box {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <div class="box">
            Services
        </div>

        <div class="box">
            Projects
        </div>

        <div class="box">
            Contact
        </div>

    </main>

    <footer>
        © 2026 My Homepage
    </footer>

</body>
</html>
