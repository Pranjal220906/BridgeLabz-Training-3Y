<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Personal_Portfolio_Basics.css">

</head>

<body class="bg-light text-dark">

    <!-- Header -->
    <header class="bg-dark text-white text-center p-5">

        <h1 class="fw-bold">
            Pranjal Chaudhary
        </h1>

        <p class="lead mb-0">
            Computer Science Student | Data & Technology Enthusiast
        </p>

    </header>


    <!-- Main -->
    <main>

        <section class="container text-center p-5">

            <!-- Profile image -->
            <img
                src="https://picsum.photos/250"
                alt="Profile Photo"
                class="img-fluid rounded-circle profile-img mb-3"
            >

            <h2 class="fw-bold mt-4">
                Hello, I'm Pranjal
            </h2>

            <p class="lead">
                I am a Computer Science student interested in
                data analytics, technology and building useful
                digital solutions.
            </p>


            <!-- Buttons -->
            <div class="mt-4 mb-3">

                <a href="#" class="btn btn-primary me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-dark">
                    Download CV
                </a>

            </div>

        </section>


        <!-- Contact Form -->
        <section class="container pb-5">

            <div class="row justify-content-center">

                <div class="col-md-7">

                    <h2 class="text-center mb-3">
                        Contact Me
                    </h2>

                    <form>

                        <!-- Bootstrap form-control -->
                        <input
                            type="text"
                            class="form-control mb-3"
                            placeholder="Your Name"
                        >

                        <input
                            type="email"
                            class="form-control mb-3"
                            placeholder="Your Email"
                        >

                        <textarea
                            class="form-control mb-3"
                            rows="5"
                            placeholder="Your Message"
                        ></textarea>

                        <button class="btn btn-primary w-100">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">

        <p class="mb-0">
            © 2026 Pranjal Chaudhary
        </p>

    </footer>

</body>
</html>
