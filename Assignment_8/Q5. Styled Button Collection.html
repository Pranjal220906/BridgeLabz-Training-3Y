<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Styled Buttons</title>

    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <header>
        <h1>Styled Button Collection</h1>
    </header>

    <main>

        <section class="button-container">

            <!-- Primary Button -->
            <div class="button-box">
                <h2>Primary</h2>

                <button class="btn primary">
                    Primary Button
                </button>

                <p>Main action button</p>
            </div>


            <!-- Secondary Button -->
            <div class="button-box">
                <h2>Secondary</h2>

                <button class="btn secondary">
                    Secondary Button
                </button>

                <p>Secondary action button</p>
            </div>


            <!-- Outline Button -->
            <div class="button-box">
                <h2>Outline</h2>

                <button class="btn outline">
                    Outline Button
                </button>

                <p>Button with outline style</p>
            </div>


            <!-- Disabled Button -->
            <div class="button-box">
                <h2>Disabled</h2>

                <button class="btn disabled" disabled>
                    Disabled Button
                </button>

                <p>Disabled using :disabled</p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Styled Button Collection</p>
    </footer>

</body>
</html>
