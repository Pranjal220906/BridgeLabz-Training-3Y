<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Tooltips</title>

    <link rel="stylesheet" href="q2.css">
</head>

<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
    </header>

    <main>

        <section class="tooltip-container">

            <!-- Tooltip 1 -->
            <div class="tooltip">
                <span>🏠</span>

                <div class="tooltip-text">
                    Home
                </div>
            </div>


            <!-- Tooltip 2 -->
            <div class="tooltip">
                <span>💻</span>

                <div class="tooltip-text">
                    Computer
                </div>
            </div>


            <!-- Tooltip 3 -->
            <div class="tooltip">
                <span>📧</span>

                <div class="tooltip-text">
                    Email
                </div>
            </div>


            <!-- Tooltip 4 -->
            <div class="tooltip">
                <span>⚙️</span>

                <div class="tooltip-text">
                    Settings
                </div>
            </div>

        </section>

    </main>

    <footer>
        <p>Hover over the icons to see tooltips</p>
    </footer>

</body>
</html>
