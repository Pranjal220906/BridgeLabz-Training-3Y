<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Filter Gallery</title>

    <link rel="stylesheet" href="Responsive_Image_Filter_Gallery.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Different CSS filters applied to images</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="gallery">

            <!-- Blur -->
            <figure class="image-card">
                <img src="https://picsum.photos/400/300?random=1"
                     alt="Nature Image"
                     class="blur">

                <figcaption>Blur</figcaption>
            </figure>


            <!-- Grayscale -->
            <figure class="image-card">
                <img src="https://picsum.photos/400/300?random=2"
                     alt="Mountain Image"
                     class="grayscale">

                <figcaption>Grayscale</figcaption>
            </figure>


            <!-- Sepia -->
            <figure class="image-card">
                <img src="https://picsum.photos/400/300?random=3"
                     alt="City Image"
                     class="sepia">

                <figcaption>Sepia</figcaption>
            </figure>


            <!-- Brightness -->
            <figure class="image-card">
                <img src="https://picsum.photos/400/300?random=4"
                     alt="Forest Image"
                     class="brightness">

                <figcaption>Brightness</figcaption>
            </figure>


            <!-- Contrast -->
            <figure class="image-card">
                <img src="https://picsum.photos/400/300?random=5"
                     alt="Ocean Image"
                     class="contrast">

                <figcaption>Contrast</figcaption>
            </figure>


            <!-- Hue Rotate -->
            <figure class="image-card">
                <img src="https://picsum.photos/400/300?random=6"
                     alt="Sunset Image"
                     class="hue">

                <figcaption>Hue Rotate</figcaption>
            </figure>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 Image Filter Gallery</p>
    </footer>

</body>
</html>
