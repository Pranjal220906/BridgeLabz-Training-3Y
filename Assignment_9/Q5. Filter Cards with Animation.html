<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filter Cards with Animation</title>

    <link rel="stylesheet" href="Filter_Cards_with_Animation.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Profile Cards</h1>
    </header>


    <!-- Main Content -->
    <main>

        <section class="profile-container">

            <!-- Profile 1 -->
            <article class="profile-card">

                <img src="https://picsum.photos/400/400?random=10"
                     alt="Profile 1"
                     class="grayscale">

                <div class="profile-content">
                    <h2>Rahul Sharma</h2>

                    <p>
                        Web Developer interested in modern
                        web technologies.
                    </p>
                </div>

            </article>


            <!-- Profile 2 -->
            <article class="profile-card">

                <img src="https://picsum.photos/400/400?random=11"
                     alt="Profile 2"
                     class="sepia">

                <div class="profile-content">
                    <h2>Priya Singh</h2>

                    <p>
                        UI Designer who enjoys creating
                        simple and attractive interfaces.
                    </p>
                </div>

            </article>


            <!-- Profile 3 -->
            <article class="profile-card">

                <img src="https://picsum.photos/400/400?random=12"
                     alt="Profile 3"
                     class="brightness">

                <div class="profile-content">
                    <h2>Aman Verma</h2>

                    <p>
                        Data Analyst passionate about
                        data and technology.
                    </p>
                </div>

            </article>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 Profile Cards</p>
    </footer>

</body>
</html>
