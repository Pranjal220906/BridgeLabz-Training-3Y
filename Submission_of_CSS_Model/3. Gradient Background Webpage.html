<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Fixed Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            background-color: #222;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 10;
        }

        section {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            color: white;
            font-size: 30px;
            padding: 20px;
        }

        /* Linear Gradient */
        .linear {
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        /* Radial Gradient */
        .radial {
            background: radial-gradient(
                circle,
                #ff9a9e,
                #fad0c4,
                #ffdde1
            );
            color: #222;
        }

        /* Parallax-like effect */
        .parallax {
            background: linear-gradient(
                135deg,
                #11998e,
                #38ef7d
            );

            background-attachment: fixed;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 50px;

            background-color: #222;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <header>
        <h2>Gradient Webpage</h2>
    </header>

    <section class="linear">
        <div>
            <h1>Linear Gradient</h1>
            <p>This section uses a linear gradient background.</p>
        </div>
    </section>

    <section class="radial">
        <div>
            <h1>Radial Gradient</h1>
            <p>This section uses a radial gradient background.</p>
        </div>
    </section>

    <section class="parallax">
        <div>
            <h1>Fixed Background</h1>
            <p>This section uses background-attachment: fixed.</p>
        </div>
    </section>

    <footer>
        © 2026 Gradient Page
    </footer>

</body>
</html>
