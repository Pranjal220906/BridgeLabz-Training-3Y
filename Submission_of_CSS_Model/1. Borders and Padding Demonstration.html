<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .box {
            width: 200px;
            height: 180px;
            background-color: white;
            text-align: center;
            transition: 0.3s;
        }

        .solid {
            border: 5px solid black;
            padding: 20px;
        }

        .dashed {
            border: 5px dashed black;
            padding: 30px;
        }

        .double {
            border: 8px double black;
            padding: 15px;
        }

        .groove {
            border: 8px groove gray;
            padding: 25px;
        }

        .rounded {
            border: 5px solid black;
            border-radius: 25px;
            padding: 20px;
        }

        .circle {
            border: 5px solid black;
            border-radius: 50%;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box:hover {
            border-color: blue;
        }

        h2 {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Borders and Padding Demonstration</h1>

    <div class="container">

        <div class="box solid">
            <h2>Solid</h2>
            <p>Padding: 20px</p>
        </div>

        <div class="box dashed">
            <h2>Dashed</h2>
            <p>Padding: 30px</p>
        </div>

        <div class="box double">
            <h2>Double</h2>
            <p>Padding: 15px</p>
        </div>

        <div class="box groove">
            <h2>Groove</h2>
            <p>Padding: 25px</p>
        </div>

        <div class="box rounded">
            <h2>Rounded</h2>
            <p>border-radius</p>
        </div>

        <div class="box circle">
            <h2>Circle</h2>
        </div>

    </div>

</body>
</html>
