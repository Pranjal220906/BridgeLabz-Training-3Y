<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="team">

        <h1>Our Team</h1>

        <div class="team-container">

            <article class="card">
                <img src="https://i.pravatar.cc/200?img=12" alt="Aarav">

                <h2>Aarav Sharma</h2>
                <h3>Frontend Developer</h3>

                <p>
                    Creates responsive and accessible interfaces
                    using HTML and CSS.
                </p>
            </article>

            <article class="card lead">
                <img src="https://i.pravatar.cc/200?img=47" alt="Riya">

                <h2>Riya Verma</h2>
                <h3>Team Lead</h3>

                <p>
                    Coordinates the team and guides projects
                    from planning to completion.
                </p>
            </article>

            <article class="card">
                <img src="https://i.pravatar.cc/200?img=33" alt="Kabir">

                <h2>Kabir Singh</h2>
                <h3>UI Designer</h3>

                <p>
                    Designs modern layouts and visual experiences
                    focused on usability.
                </p>
            </article>

        </div>

    </main>

</body>
</html>
